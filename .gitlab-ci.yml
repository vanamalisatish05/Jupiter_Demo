variables:
  DOT_API_TOKEN: $DOT_API_TOKEN
  DOT_CLI_PROJECT_ID: $DOT_CLI_PROJECT_ID
  CI_JOB_TOKEN: $CI_JOB_TOKEN
  BUILD_ID:
    value: '1.0'
    description: 'Build id of upload'
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - test
  - report

test:
  stage: test
  script: 
    - yarn install
    - yarn playwright install
    - yarn test
  artifacts:
    name: 'JUnit test results'
    when: always
    reports:
      junit:
        - test-results/*.xml
    paths:
      - metadata.json
      - metadata.yaml

report:
  stage: report
  cache:
    paths:
      - .cache/pip
      - venv/
  before_script:
    - python --version ; pip --version
    - pip install virtualenv
    - python -m virtualenv venv
    - source venv/bin/activate
  script:
    # Assign browserName and browserVersion to variables from metadata.json
    - BROWSER_NAME=$(jq .browserName metadata.json)
    - BROWSER_VERSION=$(jq .browserVersion metadata.json)
    # Install planit-cli
    - pip install planit --index-url https://gitlab-ci-token:${CI_JOB_TOKEN}@git.planittesting.com/api/v4/projects/${DOT_CLI_PROJECT_ID}/packages/pypi/simple
    # Call planit-cli to upload test-results
    - planit dot upload test-results/results.xml --metadata metadata.yaml --token $DOT_API_TOKEN --build_id $BUILD_ID --browsername $BROWSER_NAME --browserversion $BROWSER_VERSION
